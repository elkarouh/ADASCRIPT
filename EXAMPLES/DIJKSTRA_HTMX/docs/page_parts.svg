<svg xmlns="http://www.w3.org/2000/svg" width="920" height="586" viewBox="0 0 920 586" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs>
<rect width="100%" height="100%" fill="#f7f8fa"/>
<text x="30" y="34" font-size="16" fill="#1f2933" font-weight="700" text-anchor="start" >The page is made of parts, each made by one function</text>
<rect x="40" y="60" width="870" height="46" rx="6" fill="#ffffff" stroke="#cbd2d9"/>
<text x="56" y="88" font-size="14" fill="#1f2933" font-weight="700" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">div#all</text>
<text x="260" y="88" font-size="13.5" fill="#52606d" font-weight="400" text-anchor="start" >the whole page; htmx replaces it</text>
<text x="620" y="88" font-size="13" fill="#3a66db" font-weight="400" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">all_html()</text>
<rect x="40" y="114" width="870" height="46" rx="6" fill="#ffffff" stroke="#cbd2d9"/>
<text x="56" y="142" font-size="14" fill="#1f2933" font-weight="700" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">form#state</text>
<text x="260" y="142" font-size="13.5" fill="#52606d" font-weight="400" text-anchor="start" >hidden: the start and the goal</text>
<text x="620" y="142" font-size="13" fill="#3a66db" font-weight="400" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">all_html()</text>
<rect x="40" y="168" width="870" height="46" rx="6" fill="#ffffff" stroke="#cbd2d9"/>
<text x="56" y="196" font-size="14" fill="#1f2933" font-weight="700" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">form#move</text>
<text x="260" y="196" font-size="13.5" fill="#52606d" font-weight="400" text-anchor="start" >hidden: where a dragged node went</text>
<text x="620" y="196" font-size="13" fill="#3a66db" font-weight="400" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">all_html()</text>
<rect x="40" y="222" width="870" height="46" rx="6" fill="#ffffff" stroke="#cbd2d9"/>
<text x="56" y="250" font-size="14" fill="#1f2933" font-weight="700" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">form#gesture</text>
<text x="260" y="250" font-size="13.5" fill="#52606d" font-weight="400" text-anchor="start" >hidden: name, a, b, cost, pick; buttons press</text>
<text x="620" y="250" font-size="13" fill="#3a66db" font-weight="400" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">node_ and edge_buttons_html()</text>
<rect x="40" y="276" width="870" height="46" rx="6" fill="#ffffff" stroke="#cbd2d9"/>
<text x="56" y="304" font-size="14" fill="#1f2933" font-weight="700" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">div.toolbar</text>
<text x="260" y="304" font-size="13.5" fill="#52606d" font-weight="400" text-anchor="start" >Relayout and Reset buttons</text>
<text x="620" y="304" font-size="13" fill="#3a66db" font-weight="400" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">all_html()</text>
<rect x="40" y="330" width="870" height="46" rx="6" fill="#ffffff" stroke="#cbd2d9"/>
<text x="56" y="358" font-size="14" fill="#1f2933" font-weight="700" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">p.said, p.problem</text>
<text x="260" y="358" font-size="13.5" fill="#52606d" font-weight="400" text-anchor="start" >the line under the picture</text>
<text x="620" y="358" font-size="13" fill="#3a66db" font-weight="400" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">said_of(), the problem text</text>
<rect x="40" y="384" width="870" height="46" rx="6" fill="#ffffff" stroke="#cbd2d9"/>
<text x="56" y="412" font-size="14" fill="#1f2933" font-weight="700" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">svg.graph</text>
<text x="260" y="412" font-size="13.5" fill="#52606d" font-weight="400" text-anchor="start" >the drawing: every edge, then every node</text>
<text x="620" y="412" font-size="13" fill="#3a66db" font-weight="400" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">to_html(net, p, way)</text>
<rect x="40" y="438" width="870" height="46" rx="6" fill="#ffffff" stroke="#cbd2d9"/>
<text x="56" y="466" font-size="14" fill="#1f2933" font-weight="700" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">div#menus</text>
<text x="260" y="466" font-size="13.5" fill="#52606d" font-weight="400" text-anchor="start" >right-click menus (hidden until used)</text>
<text x="620" y="466" font-size="13" fill="#3a66db" font-weight="400" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">menus_html()</text>
<rect x="40" y="492" width="870" height="46" rx="6" fill="#ffffff" stroke="#cbd2d9"/>
<text x="56" y="520" font-size="14" fill="#1f2933" font-weight="700" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">pre#network</text>
<text x="260" y="520" font-size="13.5" fill="#52606d" font-weight="400" text-anchor="start" >the network as text; the browser reads it</text>
<text x="620" y="520" font-size="13" fill="#3a66db" font-weight="400" text-anchor="start" font-family="ui-monospace, Menlo, Consolas, monospace">net.text()</text>
<text x="40" y="560" font-size="12.5" fill="#52606d" font-weight="400" text-anchor="start" >Left: the element. Middle: what it is for. Right: the Adascript function that writes its HTML.</text>
</svg>
