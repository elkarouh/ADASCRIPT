<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="820" height="440" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="820" height="440" fill="#ffffff"/>
  <text x="410" y="26" text-anchor="middle" fill="#334155" font-weight="bold" font-size="15">The powered descent: altitude over time (the points are what the program prints)</text>

  <!-- phase bands: 0..692 s, 692..846 s, 846..880 s ; x = 80 + t * 0.7556 -->
  <rect x="80" y="50" width="523" height="290" fill="#fff7ed"/>
  <rect x="603" y="50" width="116" height="290" fill="#eff6ff"/>
  <rect x="719" y="50" width="26" height="290" fill="#f0fdf4"/>
  <text x="341" y="72" text-anchor="middle" fill="#9a3412" font-weight="bold">P63  BRAKING</text>
  <text x="341" y="90" text-anchor="middle" fill="#9a3412">kill the sideways speed, engine near full thrust</text>
  <text x="661" y="72" text-anchor="middle" fill="#1d4ed8" font-weight="bold">P64</text>
  <text x="661" y="90" text-anchor="middle" fill="#1d4ed8">APPROACH</text>
  <text x="732" y="72" text-anchor="middle" fill="#15803d" font-weight="bold">P65</text>

  <!-- axes -->
  <g stroke="#94a3b8" stroke-width="1">
    <line x1="80" y1="340" x2="770" y2="340"/>
    <line x1="80" y1="50" x2="80" y2="340"/>
  </g>
  <g fill="#475569" font-size="12" text-anchor="end">
    <text x="72" y="64">15 km</text>
    <text x="72" y="157">10 km</text>
    <text x="72" y="250">5 km</text>
    <text x="72" y="344">0</text>
  </g>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="80" y1="153" x2="745" y2="153"/>
    <line x1="80" y1="247" x2="745" y2="247"/>
  </g>
  <g fill="#475569" font-size="12" text-anchor="middle">
    <text x="80" y="358">0 s</text>
    <text x="231" y="358">200 s</text>
    <text x="382" y="358">400 s</text>
    <text x="533" y="358">600 s</text>
    <text x="684" y="358">800 s</text>
  </g>
  <text x="425" y="380" text-anchor="middle" fill="#475569" font-size="12">time since powered descent began</text>

  <!-- the descent -->
  <path d="M 80 60 C 300 85, 480 230, 603 301 C 660 330, 700 338, 719 339 L 745 340" fill="none" stroke="#0f172a" stroke-width="2.5"/>
  <g fill="#0f172a">
    <circle cx="80" cy="60" r="5"/>
    <circle cx="603" cy="301" r="5"/>
    <circle cx="719" cy="339" r="5"/>
    <circle cx="745" cy="340" r="5" fill="#15803d"/>
  </g>
  <g font-size="12" fill="#0f172a">
    <text x="92" y="118">t = 0 s: 15 000 m up,</text>
    <text x="92" y="134">1693 m/s, 8103 kg of fuel</text>
    <text x="440" y="296" text-anchor="end">t = 692 s: 2069 m, 90 m/s, 1443 kg</text>
    <line x1="444" y1="292" x2="596" y2="300" stroke="#0f172a" stroke-width="0.8"/>
    <text x="600" y="400" text-anchor="end">t = 846 s: 55 m, 5.4 m/s, 690 kg</text>
    <line x1="604" y1="396" x2="716" y2="344" stroke="#0f172a" stroke-width="0.8"/>
    <text x="800" y="420" text-anchor="end" fill="#15803d" font-weight="bold">touchdown at 880 s, about 1 m/s, 533 kg left</text>
    <line x1="760" y1="406" x2="746" y2="346" stroke="#15803d" stroke-width="0.8"/>
  </g>
</svg>
