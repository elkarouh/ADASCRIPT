<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <radialGradient id="earth" cx="35%" cy="35%" r="70%">
      <stop offset="0" stop-color="#7dd3fc"/><stop offset="1" stop-color="#1d4ed8"/>
    </radialGradient>
    <radialGradient id="moon" cx="35%" cy="35%" r="70%">
      <stop offset="0" stop-color="#f1f5f9"/><stop offset="1" stop-color="#94a3b8"/>
    </radialGradient>
  </defs>
  <rect width="820" height="470" fill="#ffffff"/>
  <rect width="820" height="470" fill="#0b1220" opacity="0.03"/>

  <!-- the Moon's orbit round the Earth -->
  <circle cx="300" cy="235" r="200" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 6"/>
  <text x="300" y="24" text-anchor="middle" fill="#475569">the Moon's orbit round the Earth (384 400 km away)</text>
  <path d="M 150 103 A 200 200 0 0 1 226 49" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrowGrey)"/>
  <text x="40" y="66" fill="#64748b" font-size="12">the Moon moves on</text>

  <!-- Earth and the parking orbit -->
  <circle cx="300" cy="235" r="42" fill="none" stroke="#0284c7" stroke-width="1.2" stroke-dasharray="3 4"/>
  <circle cx="300" cy="235" r="30" fill="url(#earth)"/>
  <text x="300" y="240" text-anchor="middle" fill="#ffffff" font-weight="bold" font-size="13">Earth</text>
  <text x="248" y="200" text-anchor="end" fill="#0369a1" font-size="12">parking orbit,</text><text x="248" y="215" text-anchor="end" fill="#0369a1" font-size="12">200 km up</text>

  <!-- the coast -->
  <path d="M 300 277 C 380 292, 455 275, 478 215 S 480 155, 474 140" fill="none" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arrow)"/>
  <circle cx="300" cy="277" r="5" fill="#c2410c"/>

  <!-- the Moon, captured -->
  <circle cx="464" cy="120" r="30" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="3 4"/>
  <circle cx="464" cy="120" r="17" fill="url(#moon)" stroke="#64748b" stroke-width="0.8"/>
  <text x="464" y="124" text-anchor="middle" fill="#334155" font-size="11" font-weight="bold">Moon</text>

  <!-- callouts -->
  <line x1="294" y1="283" x2="250" y2="318" stroke="#c2410c" stroke-width="1"/>
  <text x="152" y="336" fill="#9a3412" font-weight="bold">1. TLI, the big push</text>
  <text x="152" y="354" fill="#334155" font-size="13">3133 m/s, from the parking orbit</text>

  <line x1="478" y1="225" x2="610" y2="290" stroke="#c2410c" stroke-width="1"/>
  <text x="615" y="300" fill="#9a3412" font-weight="bold">2. Coast, about 4.6 days</text>
  <text x="615" y="318" fill="#334155" font-size="13">engine off, bent by the pull</text>
  <text x="615" y="335" fill="#334155" font-size="13">of the Earth and the Moon</text>

  <line x1="494" y1="112" x2="610" y2="90" stroke="#7c3aed" stroke-width="1"/>
  <text x="615" y="80" fill="#6d28d9" font-weight="bold">3-5. Captured by the Moon</text>
  <text x="615" y="98" fill="#334155" font-size="13">two braking burns leave it on</text>
  <text x="615" y="115" fill="#334155" font-size="13">a circle 100 km above the surface</text>

  <text x="410" y="455" text-anchor="middle" fill="#64748b" font-size="12" font-style="italic">Not to scale: the Moon is about 1900 times farther away than the parking orbit is high.</text>
</svg>
