# accounting.conf -- the ledger's settings, and the chart of accounts a new
# ledger starts with (`ledger init`).
#
# A setting is "name value". An account is "number kind name": the number as
# in the Belgian chart of accounts (its first digit is the class: 1 equity and
# long-term debts, 2 fixed assets, 3 stock, 4 receivables and payables, 5 cash,
# 6 costs, 7 revenue), the kind one of asset, liability, equity, revenue,
# expense, and the name the rest of the line. # starts a comment.

database  accounting.db     # beside this file, unless the path is absolute
currency  USD

# number  kind        name
100000    equity      Capital
173000    liability   Loans
211000    asset       Software
240000    asset       Furniture
340000    asset       Stock
400001    asset       Customer 1
400002    asset       Customer 2
411000    asset       VAT to recover
440000    liability   Suppliers
451000    liability   VAT to pay
489000    liability   Credit card
550000    asset       Bank account
604000    expense     Cost of sales
613000    expense     Food
620000    expense     Payroll
630000    expense     Depreciation
700000    revenue     Sales
720000    revenue     Own work capitalised
