<svg xmlns="http://www.w3.org/2000/svg" width="920" height="440" viewBox="0 0 920 440" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs>
<rect width="100%" height="100%" fill="#f7f8fa"/>
<text x="30" y="34" font-size="16" fill="#1f2933" font-weight="700" text-anchor="start" >Why htmx: the page asks the server, and the answer is HTML</text>
<text x="30" y="74" font-size="14" fill="#616e7c" font-weight="700" text-anchor="start" >The usual way: JavaScript does every step</text>
<rect x="30" y="90" width="180" height="56" rx="8" fill="#f5f5f5" stroke="#b0b8c1" stroke-width="1.5"/>
<text x="120.0" y="123.0" text-anchor="middle" font-size="13.5" fill="#1f2933" font-weight="700" >Button click</text>
<line x1="210" y1="118" x2="250" y2="118" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="250" y="90" width="180" height="56" rx="8" fill="#f5f5f5" stroke="#b0b8c1" stroke-width="1.5"/>
<text x="340.0" y="123.0" text-anchor="middle" font-size="13.5" fill="#1f2933" font-weight="700" >JS handler</text>
<line x1="430" y1="118" x2="470" y2="118" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="470" y="90" width="180" height="56" rx="8" fill="#f5f5f5" stroke="#b0b8c1" stroke-width="1.5"/>
<text x="560.0" y="123.0" text-anchor="middle" font-size="13.5" fill="#1f2933" font-weight="700" >fetch JSON</text>
<line x1="650" y1="118" x2="690" y2="118" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="690" y="90" width="180" height="56" rx="8" fill="#f5f5f5" stroke="#b0b8c1" stroke-width="1.5"/>
<text x="780.0" y="123.0" text-anchor="middle" font-size="13.5" fill="#1f2933" font-weight="700" >JS builds the DOM</text>
<text x="30" y="190" font-size="12.5" fill="#52606d" font-weight="400" text-anchor="start" >Two languages and a JSON format to keep in step. The server returns data; the page knows how to show it.</text>
<text x="30" y="250" font-size="14" fill="#616e7c" font-weight="700" text-anchor="start" >The htmx way: the page says what to ask, in its own markup</text>
<rect x="30" y="266" width="180" height="56" rx="8" fill="#eef7ef" stroke="#2e7d32" stroke-width="1.5"/>
<text x="120.0" y="299.0" text-anchor="middle" font-size="13.5" fill="#1f2933" font-weight="700" >Button with hx-put</text>
<line x1="210" y1="294" x2="250" y2="294" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="250" y="266" width="180" height="56" rx="8" fill="#eef7ef" stroke="#2e7d32" stroke-width="1.5"/>
<text x="340.0" y="299.0" text-anchor="middle" font-size="13.5" fill="#1f2933" font-weight="700" >htmx sends PUT</text>
<line x1="430" y1="294" x2="470" y2="294" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="470" y="266" width="180" height="56" rx="8" fill="#eef7ef" stroke="#2e7d32" stroke-width="1.5"/>
<text x="560.0" y="299.0" text-anchor="middle" font-size="13.5" fill="#1f2933" font-weight="700" >server answers HTML</text>
<line x1="650" y1="294" x2="690" y2="294" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="690" y="266" width="180" height="56" rx="8" fill="#eef7ef" stroke="#2e7d32" stroke-width="1.5"/>
<text x="780.0" y="299.0" text-anchor="middle" font-size="13.5" fill="#1f2933" font-weight="700" >htmx swaps #all</text>
<text x="30" y="366" font-size="12.5" fill="#52606d" font-weight="400" text-anchor="start" >One language for the server, and the page is the answer. The attribute on the button is the whole</text>
<text x="30" y="386" font-size="12.5" fill="#52606d" font-weight="400" text-anchor="start" >request. hx-put names the route, hx-include names the fields, hx-target and hx-swap say where it goes.</text>
<text x="30" y="416" font-size="12.5" fill="#52606d" font-weight="400" text-anchor="start" >The browser keeps only what must be fast: the drag (dijkstra_js_events.ady).</text>
</svg>
