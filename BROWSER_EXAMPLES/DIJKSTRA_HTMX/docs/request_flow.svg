<svg xmlns="http://www.w3.org/2000/svg" width="920" height="450" viewBox="0 0 920 450" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs>
<rect width="100%" height="100%" fill="#f7f8fa"/>
<text x="30" y="34" font-size="16" fill="#1f2933" font-weight="700" text-anchor="start" >One request, from a click to the new page</text>
<rect x="40" y="70" width="180" height="90" rx="8" fill="#fff" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="130.0" y="101.0" text-anchor="middle" font-size="15" fill="#1f2933" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">Browser</text>
<text x="130.0" y="120.0" text-anchor="middle" font-size="13" fill="#52606d"  >a button, or request()</text>
<text x="130.0" y="139.0" text-anchor="middle" font-size="13" fill="#52606d"  >POST /nodes, its fields</text>
<rect x="260" y="70" width="180" height="90" rx="8" fill="#fff" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="350.0" y="91.5" text-anchor="middle" font-size="15" fill="#1f2933" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">htmx</text>
<text x="350.0" y="110.5" text-anchor="middle" font-size="13" fill="#52606d"  >sends POST /nodes</text>
<text x="350.0" y="129.5" text-anchor="middle" font-size="13" fill="#52606d"  >with those fields</text>
<text x="350.0" y="148.5" text-anchor="middle" font-size="13" fill="#52606d"  >and the form #state</text>
<rect x="480" y="70" width="180" height="90" rx="8" fill="#fff" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="570.0" y="101.0" text-anchor="middle" font-size="15" fill="#1f2933" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">server.ady</text>
<text x="570.0" y="120.0" text-anchor="middle" font-size="13" fill="#52606d"  >matches the path,</text>
<text x="570.0" y="139.0" text-anchor="middle" font-size="13" fill="#52606d"  >hands the request on</text>
<rect x="700" y="70" width="180" height="90" rx="8" fill="#e8f0fe" stroke="#3a66db" stroke-width="1.5"/>
<text x="790.0" y="101.0" text-anchor="middle" font-size="15" fill="#1f2933" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">answer()</text>
<text x="790.0" y="120.0" text-anchor="middle" font-size="13" fill="#52606d"  >dijkstra_events_gui</text>
<text x="790.0" y="139.0" text-anchor="middle" font-size="13" fill="#52606d"  >one case per route</text>
<line x1="220" y1="115" x2="260" y2="115" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="440" y1="115" x2="480" y2="115" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="660" y1="115" x2="700" y2="115" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="700" y="250" width="180" height="90" rx="8" fill="#e8f0fe" stroke="#3a66db" stroke-width="1.5"/>
<text x="790.0" y="281.0" text-anchor="middle" font-size="15" fill="#1f2933" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">Network</text>
<text x="790.0" y="300.0" text-anchor="middle" font-size="13" fill="#52606d"  >net.add_node(name)</text>
<text x="790.0" y="319.0" text-anchor="middle" font-size="13" fill="#52606d"  >net.put(name, place)</text>
<rect x="480" y="250" width="180" height="90" rx="8" fill="#fff" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="570.0" y="281.0" text-anchor="middle" font-size="15" fill="#1f2933" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">save()</text>
<text x="570.0" y="300.0" text-anchor="middle" font-size="13" fill="#52606d"  >writes graph.txt</text>
<text x="570.0" y="319.0" text-anchor="middle" font-size="13" fill="#52606d"  >after every change</text>
<rect x="260" y="250" width="180" height="90" rx="8" fill="#fff" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="350.0" y="281.0" text-anchor="middle" font-size="15" fill="#1f2933" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">all_text()</text>
<text x="350.0" y="300.0" text-anchor="middle" font-size="13" fill="#52606d"  >the page as HTML</text>
<text x="350.0" y="319.0" text-anchor="middle" font-size="13" fill="#52606d"  >(dijkstra_gui.ady)</text>
<rect x="40" y="250" width="180" height="90" rx="8" fill="#eef7ef" stroke="#2e7d32" stroke-width="1.5"/>
<text x="130.0" y="281.0" text-anchor="middle" font-size="15" fill="#1f2933" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">htmx swaps</text>
<text x="130.0" y="300.0" text-anchor="middle" font-size="13" fill="#52606d"  >the answer into #all</text>
<text x="130.0" y="319.0" text-anchor="middle" font-size="13" fill="#52606d"  >hx-swap=outerHTML</text>
<line x1="790" y1="160" x2="790" y2="250" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<text x="800" y="210" text-anchor="start" font-size="12.5" fill="#3e4c59">change</text>
<line x1="700" y1="295" x2="660" y2="295" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<text x="680.0" y="288.0" text-anchor="middle" font-size="12.5" fill="#3e4c59">then</text>
<line x1="480" y1="295" x2="440" y2="295" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="260" y1="295" x2="220" y2="295" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="130" y1="160" x2="130" y2="250" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<text x="138" y="210" text-anchor="start" font-size="12.5" fill="#3e4c59">page back</text>
<text x="40" y="400" font-size="13" fill="#52606d" font-weight="400" text-anchor="start" >Each request sends the whole picture of the page's choice (#state),</text>
<text x="40" y="420" font-size="13" fill="#52606d" font-weight="400" text-anchor="start" >and gets back the whole page. htmx replaces #all with it; nothing else is patched.</text>
</svg>
