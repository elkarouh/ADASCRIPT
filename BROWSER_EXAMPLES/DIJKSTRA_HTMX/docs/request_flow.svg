<svg xmlns="http://www.w3.org/2000/svg" width="920" height="640" viewBox="0 0 920 640" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs>
<rect width="100%" height="100%" fill="#f7f8fa"/>
<text x="30" y="34" font-size="16" fill="#1f2933" font-weight="700" text-anchor="start" >A change, from a click to every open page: the command goes in, the change goes out</text>
<rect x="40" y="80" width="180" height="90" rx="8" fill="#fff" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="130.0" y="111.0" text-anchor="middle" font-size="15" fill="#1f2933" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">Browser</text>
<text x="130.0" y="130.0" text-anchor="middle" font-size="13" fill="#52606d"  >a button, or request()</text>
<text x="130.0" y="149.0" text-anchor="middle" font-size="13" fill="#52606d"  >POST /nodes, its fields</text>
<rect x="260" y="80" width="180" height="90" rx="8" fill="#fff" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="350.0" y="101.5" text-anchor="middle" font-size="15" fill="#1f2933" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">htmx</text>
<text x="350.0" y="120.5" text-anchor="middle" font-size="13" fill="#52606d"  >sends POST /nodes</text>
<text x="350.0" y="139.5" text-anchor="middle" font-size="13" fill="#52606d"  >with those fields</text>
<text x="350.0" y="158.5" text-anchor="middle" font-size="13" fill="#52606d"  >and the form #state</text>
<rect x="480" y="80" width="180" height="90" rx="8" fill="#fff" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="570.0" y="111.0" text-anchor="middle" font-size="15" fill="#1f2933" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">server.ady</text>
<text x="570.0" y="130.0" text-anchor="middle" font-size="13" fill="#52606d"  >matches the path,</text>
<text x="570.0" y="149.0" text-anchor="middle" font-size="13" fill="#52606d"  >hands the request on</text>
<rect x="700" y="80" width="180" height="90" rx="8" fill="#e8f0fe" stroke="#3a66db" stroke-width="1.5"/>
<text x="790.0" y="111.0" text-anchor="middle" font-size="15" fill="#1f2933" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">answer()</text>
<text x="790.0" y="130.0" text-anchor="middle" font-size="13" fill="#52606d"  >dijkstra_events_gui</text>
<text x="790.0" y="149.0" text-anchor="middle" font-size="13" fill="#52606d"  >one case per route</text>
<line x1="220" y1="125" x2="260" y2="125" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="440" y1="125" x2="480" y2="125" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="660" y1="125" x2="700" y2="125" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M 760 170 V 200 H 130 V 172" fill="none" stroke="#52606d" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="445" y="194" text-anchor="middle" font-size="12.5" fill="#3e4c59">the answer: #problem, empty, or why it was refused (nothing else)</text>
<rect x="700" y="250" width="180" height="90" rx="8" fill="#e8f0fe" stroke="#3a66db" stroke-width="1.5"/>
<text x="790.0" y="281.0" text-anchor="middle" font-size="15" fill="#1f2933" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">Network</text>
<text x="790.0" y="300.0" text-anchor="middle" font-size="13" fill="#52606d"  >net.add_node(name)</text>
<text x="790.0" y="319.0" text-anchor="middle" font-size="13" fill="#52606d"  >net.put(name, place)</text>
<line x1="820" y1="170" x2="820" y2="250" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<text x="828" y="215" text-anchor="start" font-size="12.5" fill="#3e4c59">change</text>
<rect x="480" y="250" width="180" height="90" rx="8" fill="#fff4e5" stroke="#e65100" stroke-width="1.5"/>
<text x="570.0" y="281.0" text-anchor="middle" font-size="15" fill="#1f2933" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">nodes.publish</text>
<text x="570.0" y="300.0" text-anchor="middle" font-size="13" fill="#52606d"  >Change(CREATE, H)</text>
<text x="570.0" y="319.0" text-anchor="middle" font-size="13" fill="#52606d"  >(blackboard.ady)</text>
<line x1="700" y1="295" x2="660" y2="295" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<text x="680" y="288" text-anchor="middle" font-size="12.5" fill="#3e4c59">then</text>
<rect x="260" y="250" width="180" height="90" rx="8" fill="#fff" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="350.0" y="281.0" text-anchor="middle" font-size="15" fill="#1f2933" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">keep</text>
<text x="350.0" y="300.0" text-anchor="middle" font-size="13" fill="#52606d"  >writes graph.txt</text>
<text x="350.0" y="319.0" text-anchor="middle" font-size="13" fill="#52606d"  >(first)</text>
<rect x="40" y="250" width="180" height="90" rx="8" fill="#fff" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="130.0" y="281.0" text-anchor="middle" font-size="15" fill="#1f2933" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">tell</text>
<text x="130.0" y="300.0" text-anchor="middle" font-size="13" fill="#52606d"  >data: nodes CREATE H</text>
<text x="130.0" y="319.0" text-anchor="middle" font-size="13" fill="#52606d"  >to every GET /events</text>
<line x1="480" y1="280" x2="440" y2="280" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M 570 340 V 366 H 160 V 342" fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<text x="365" y="360" text-anchor="middle" font-size="12.5" fill="#3e4c59">then</text>
<rect x="40" y="420" width="180" height="90" rx="8" fill="#eef7ef" stroke="#2e7d32" stroke-width="1.5"/>
<text x="130.0" y="451.0" text-anchor="middle" font-size="15" fill="#1f2933" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">every page</text>
<text x="130.0" y="470.0" text-anchor="middle" font-size="13" fill="#52606d"  >follow(&quot;/events&quot;, news)</text>
<text x="130.0" y="489.0" text-anchor="middle" font-size="13" fill="#52606d"  >hears the change</text>
<rect x="260" y="420" width="180" height="90" rx="8" fill="#fff" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="350.0" y="451.0" text-anchor="middle" font-size="15" fill="#1f2933" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">htmx</text>
<text x="350.0" y="470.0" text-anchor="middle" font-size="13" fill="#52606d"  >sends GET /all</text>
<text x="350.0" y="489.0" text-anchor="middle" font-size="13" fill="#52606d"  >with the form #state</text>
<rect x="480" y="420" width="180" height="90" rx="8" fill="#e8f0fe" stroke="#3a66db" stroke-width="1.5"/>
<text x="570.0" y="451.0" text-anchor="middle" font-size="15" fill="#1f2933" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">answer()</text>
<text x="570.0" y="470.0" text-anchor="middle" font-size="13" fill="#52606d"  >all_text(): the page</text>
<text x="570.0" y="489.0" text-anchor="middle" font-size="13" fill="#52606d"  >(dijkstra_gui.ady)</text>
<rect x="700" y="420" width="180" height="90" rx="8" fill="#eef7ef" stroke="#2e7d32" stroke-width="1.5"/>
<text x="790.0" y="451.0" text-anchor="middle" font-size="15" fill="#1f2933" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">htmx swaps</text>
<text x="790.0" y="470.0" text-anchor="middle" font-size="13" fill="#52606d"  >the page into #all</text>
<text x="790.0" y="489.0" text-anchor="middle" font-size="13" fill="#52606d"  >hx-swap=outerHTML</text>
<line x1="100" y1="340" x2="100" y2="420" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<text x="108" y="395" text-anchor="start" font-size="12.5" fill="#3e4c59">every open page</text>
<line x1="220" y1="465" x2="260" y2="465" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="440" y1="465" x2="480" y2="465" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="660" y1="465" x2="700" y2="465" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<text x="40" y="560" font-size="13" fill="#52606d" font-weight="400" text-anchor="start" >A command answers only whether it went through. The page is drawn again from the news of the</text>
<text x="40" y="580" font-size="13" fill="#52606d" font-weight="400" text-anchor="start" >change, the same way on every page: commands in, events out. A refused command publishes nothing.</text>
</svg>
