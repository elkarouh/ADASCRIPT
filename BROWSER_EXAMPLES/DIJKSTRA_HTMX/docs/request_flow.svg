<svg xmlns="http://www.w3.org/2000/svg" width="1210" height="660" viewBox="0 0 1210 660" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs>
<rect width="100%" height="100%" fill="#f7f8fa"/>
<text x="30" y="34" font-size="16" fill="#1f2933" font-weight="700" text-anchor="start" >A change, from a gesture to every open page: a command goes in, the change comes out</text>
<line x1="30" y1="62" x2="680" y2="62" stroke="#3a66db" stroke-width="1"/>
<line x1="760" y1="62" x2="1180" y2="62" stroke="#3a66db" stroke-width="1"/>
<text x="30" y="56" font-size="13" fill="#3a66db" font-weight="700" text-anchor="start" >in the browser: dijkstra_js_events.ady</text>
<text x="760" y="56" font-size="13" fill="#3a66db" font-weight="700" text-anchor="start" >on the server: dijkstra_events_gui.ady</text>
<rect x="30" y="80" width="190" height="100" rx="8" fill="#eef7ef" stroke="#2e7d32" stroke-width="1.5"/>
<text x="125.0" y="106.5" text-anchor="middle" font-size="15" fill="#1f2933" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">a gesture</text>
<text x="125.0" y="125.5" text-anchor="middle" font-size="13" fill="#52606d"  >right-click, Delete node</text>
<text x="125.0" y="144.5" text-anchor="middle" font-size="13" fill="#52606d"  >or the Delete key:</text>
<text x="125.0" y="163.5" text-anchor="middle" font-size="13" fill="#52606d"  >the same command</text>
<rect x="260" y="80" width="190" height="100" rx="8" fill="#fff4e5" stroke="#e65100" stroke-width="1.5"/>
<text x="355.0" y="106.5" text-anchor="middle" font-size="15" fill="#1f2933" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">commands</text>
<text x="355.0" y="125.5" text-anchor="middle" font-size="13" fill="#52606d"  >ask_for(delete_node(H))</text>
<text x="355.0" y="144.5" text-anchor="middle" font-size="13" fill="#52606d"  >a Command, published</text>
<text x="355.0" y="163.5" text-anchor="middle" font-size="13" fill="#52606d"  >on the page&#x27;s blackboard</text>
<rect x="490" y="80" width="190" height="100" rx="8" fill="#fff" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="585.0" y="106.5" text-anchor="middle" font-size="15" fill="#1f2933" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">liaison</text>
<text x="585.0" y="125.5" text-anchor="middle" font-size="13" fill="#52606d"  >not a draft: send(c)</text>
<text x="585.0" y="144.5" text-anchor="middle" font-size="13" fill="#52606d"  >method_of, url_of</text>
<text x="585.0" y="163.5" text-anchor="middle" font-size="13" fill="#52606d"  >(a draft stays here)</text>
<rect x="760" y="80" width="190" height="100" rx="8" fill="#fff4e5" stroke="#e65100" stroke-width="1.5"/>
<text x="855.0" y="106.5" text-anchor="middle" font-size="15" fill="#1f2933" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">Command</text>
<text x="855.0" y="125.5" text-anchor="middle" font-size="13" fill="#52606d"  >command_of(method,</text>
<text x="855.0" y="144.5" text-anchor="middle" font-size="13" fill="#52606d"  >url, fields): the same</text>
<text x="855.0" y="163.5" text-anchor="middle" font-size="13" fill="#52606d"  >DELETE  NODE  name=H</text>
<rect x="990" y="80" width="190" height="100" rx="8" fill="#e8f0fe" stroke="#3a66db" stroke-width="1.5"/>
<text x="1085.0" y="116.0" text-anchor="middle" font-size="15" fill="#1f2933" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">carry_out(c)</text>
<text x="1085.0" y="135.0" text-anchor="middle" font-size="13" fill="#52606d"  >the one place</text>
<text x="1085.0" y="154.0" text-anchor="middle" font-size="13" fill="#52606d"  >a change is made</text>
<line x1="220" y1="130" x2="260" y2="130" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="450" y1="130" x2="490" y2="130" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="680" y1="130" x2="760" y2="130" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="950" y1="130" x2="990" y2="130" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<text x="720.0" y="150" text-anchor="middle" font-size="12.5" fill="#3e4c59">DELETE</text>
<text x="720.0" y="166" text-anchor="middle" font-size="12.5" fill="#3e4c59">/nodes</text>
<path d="M 1050 180 V 212 H 125 V 182" fill="none" stroke="#52606d" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="605.0" y="206" text-anchor="middle" font-size="12.5" fill="#3e4c59">the answer, into #problem: empty, or why it was refused (nothing else)</text>
<rect x="990" y="260" width="190" height="100" rx="8" fill="#e8f0fe" stroke="#3a66db" stroke-width="1.5"/>
<text x="1085.0" y="296.0" text-anchor="middle" font-size="15" fill="#1f2933" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">Network</text>
<text x="1085.0" y="315.0" text-anchor="middle" font-size="13" fill="#52606d"  >net.remove_node(H)</text>
<text x="1085.0" y="334.0" text-anchor="middle" font-size="13" fill="#52606d"  >(the blackboard)</text>
<line x1="1130" y1="180" x2="1130" y2="260" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<text x="1122" y="228" text-anchor="end" font-size="12.5" fill="#3e4c59">if it went through</text>
<rect x="760" y="260" width="190" height="100" rx="8" fill="#fff4e5" stroke="#e65100" stroke-width="1.5"/>
<text x="855.0" y="296.0" text-anchor="middle" font-size="15" fill="#1f2933" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">nodes.publish</text>
<text x="855.0" y="315.0" text-anchor="middle" font-size="13" fill="#52606d"  >Change(DELETE, H)</text>
<text x="855.0" y="334.0" text-anchor="middle" font-size="13" fill="#52606d"  >(blackboard.ady)</text>
<rect x="490" y="260" width="190" height="100" rx="8" fill="#fff" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="585.0" y="296.0" text-anchor="middle" font-size="15" fill="#1f2933" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">keep</text>
<text x="585.0" y="315.0" text-anchor="middle" font-size="13" fill="#52606d"  >writes graph.txt</text>
<text x="585.0" y="334.0" text-anchor="middle" font-size="13" fill="#52606d"  >(first)</text>
<rect x="260" y="260" width="190" height="100" rx="8" fill="#fff" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="355.0" y="296.0" text-anchor="middle" font-size="15" fill="#1f2933" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">tell</text>
<text x="355.0" y="315.0" text-anchor="middle" font-size="13" fill="#52606d"  >data: nodes DELETE H</text>
<text x="355.0" y="334.0" text-anchor="middle" font-size="13" fill="#52606d"  >to every GET /events</text>
<line x1="990" y1="310" x2="950" y2="310" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="760" y1="310" x2="680" y2="310" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="490" y1="310" x2="450" y2="310" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<text x="470.0" y="302" text-anchor="middle" font-size="12.5" fill="#3e4c59">then</text>
<rect x="30" y="450" width="190" height="100" rx="8" fill="#eef7ef" stroke="#2e7d32" stroke-width="1.5"/>
<text x="125.0" y="486.0" text-anchor="middle" font-size="15" fill="#1f2933" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">changes</text>
<text x="125.0" y="505.0" text-anchor="middle" font-size="13" fill="#52606d"  >heard: on the page&#x27;s</text>
<text x="125.0" y="524.0" text-anchor="middle" font-size="13" fill="#52606d"  >blackboard; read_again</text>
<rect x="260" y="450" width="190" height="100" rx="8" fill="#fff4e5" stroke="#e65100" stroke-width="1.5"/>
<text x="355.0" y="486.0" text-anchor="middle" font-size="15" fill="#1f2933" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">commands</text>
<text x="355.0" y="505.0" text-anchor="middle" font-size="13" fill="#52606d"  >ask_for(</text>
<text x="355.0" y="524.0" text-anchor="middle" font-size="13" fill="#52606d"  >read_network())</text>
<rect x="490" y="450" width="190" height="100" rx="8" fill="#fff" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="585.0" y="486.0" text-anchor="middle" font-size="15" fill="#1f2933" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">liaison</text>
<text x="585.0" y="505.0" text-anchor="middle" font-size="13" fill="#52606d"  >send(c): GET /all</text>
<text x="585.0" y="524.0" text-anchor="middle" font-size="13" fill="#52606d"  >with the form #state</text>
<rect x="760" y="450" width="190" height="100" rx="8" fill="#e8f0fe" stroke="#3a66db" stroke-width="1.5"/>
<text x="855.0" y="476.5" text-anchor="middle" font-size="15" fill="#1f2933" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">answer()</text>
<text x="855.0" y="495.5" text-anchor="middle" font-size="13" fill="#52606d"  >a READ: all_text(),</text>
<text x="855.0" y="514.5" text-anchor="middle" font-size="13" fill="#52606d"  >the page</text>
<text x="855.0" y="533.5" text-anchor="middle" font-size="13" fill="#52606d"  >(dijkstra_gui.ady)</text>
<rect x="990" y="450" width="190" height="100" rx="8" fill="#eef7ef" stroke="#2e7d32" stroke-width="1.5"/>
<text x="1085.0" y="495.5" text-anchor="middle" font-size="15" fill="#1f2933" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">the page</text>
<text x="1085.0" y="514.5" text-anchor="middle" font-size="13" fill="#52606d"  >swapped into #all</text>
<path d="M 355 360 V 405 H 125 V 448" fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<text x="130" y="398" text-anchor="start" font-size="12.5" fill="#3e4c59">every open page, this one too</text>
<line x1="220" y1="500" x2="260" y2="500" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="450" y1="500" x2="490" y2="500" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="680" y1="500" x2="760" y2="500" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="950" y1="500" x2="990" y2="500" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<text x="40" y="590" font-size="13" fill="#52606d" font-weight="400" text-anchor="start" >Two blackboards, one vocabulary (dijkstra_commands.ady): a gesture publishes a Command on the page&#x27;s blackboard, the</text>
<text x="40" y="610" font-size="13" fill="#52606d" font-weight="400" text-anchor="start" >liaison sends it, and answer reads the same Command back. Only carry_out changes the network, and it answers only</text>
<text x="40" y="630" font-size="13" fill="#52606d" font-weight="400" text-anchor="start" >whether it went through; every page hears the change and reads itself again. Commands in, events out.</text>
</svg>
