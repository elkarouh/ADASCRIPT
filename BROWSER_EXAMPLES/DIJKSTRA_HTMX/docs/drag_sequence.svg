<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52606d"/></marker></defs>
<rect width="100%" height="100%" fill="#f7f8fa"/>
<text x="30" y="34" font-size="16" fill="#1f2933" font-weight="700" text-anchor="start" >Dragging a node: the browser moves it, then the server keeps it and tells every page</text>
<rect x="30" y="60" width="160" height="42" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="110.0" y="86.0" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="700" >Mouse</text>
<line x1="110" y1="102" x2="110" y2="600" stroke="#cbd2d9" stroke-dasharray="4 4"/>
<rect x="220" y="60" width="160" height="42" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="300.0" y="86.0" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="700" >dijkstra_js_events</text>
<line x1="300" y1="102" x2="300" y2="600" stroke="#cbd2d9" stroke-dasharray="4 4"/>
<rect x="410" y="60" width="160" height="42" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="490.0" y="86.0" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="700" >htmx</text>
<line x1="490" y1="102" x2="490" y2="600" stroke="#cbd2d9" stroke-dasharray="4 4"/>
<rect x="600" y="60" width="160" height="42" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="680.0" y="86.0" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="700" >server, answer()</text>
<line x1="680" y1="102" x2="680" y2="600" stroke="#cbd2d9" stroke-dasharray="4 4"/>
<rect x="770" y="60" width="160" height="42" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="850.0" y="86.0" text-anchor="middle" font-size="13" fill="#1f2933" font-weight="700" >Network</text>
<line x1="850" y1="102" x2="850" y2="600" stroke="#cbd2d9" stroke-dasharray="4 4"/>
<line x1="110" y1="130" x2="300" y2="130" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<text x="205.0" y="122" font-size="12.5" fill="#3e4c59" font-weight="400" text-anchor="middle" >mousedown, then moves</text>
<path d="M 300 166 h 60 v 14 h -60" fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<text x="370" y="178" font-size="12.5" fill="#3e4c59" font-weight="400" text-anchor="start" >moved_cb: NetworkView.move, edges redrawn</text>
<line x1="110" y1="210" x2="300" y2="210" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<text x="205.0" y="202" font-size="12.5" fill="#3e4c59" font-weight="400" text-anchor="middle" >mouse up</text>
<path d="M 300 246 h 60 v 14 h -60" fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<text x="370" y="258" font-size="12.5" fill="#3e4c59" font-weight="400" text-anchor="start" >dropped_cb: send(update_node(A, at))</text>
<line x1="300" y1="292" x2="490" y2="292" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<text x="395.0" y="284" font-size="12.5" fill="#3e4c59" font-weight="400" text-anchor="middle" >PUT /nodes?name=A&amp;x=…&amp;y=…</text>
<line x1="490" y1="322" x2="680" y2="322" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<text x="585.0" y="314" font-size="12.5" fill="#3e4c59" font-weight="400" text-anchor="middle" >command_of: UPDATE NODE A</text>
<line x1="680" y1="352" x2="850" y2="352" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<text x="765.0" y="344" font-size="12.5" fill="#3e4c59" font-weight="400" text-anchor="middle" >carry_out: put(A, Spot_T(x, y))</text>
<path d="M 680 382 h 60 v 14 h -60" fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<text x="750" y="394" font-size="12.5" fill="#3e4c59" font-weight="400" text-anchor="start" >publish UPDATE A</text>
<path d="M 680 422 h 60 v 14 h -60" fill="none" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<text x="750" y="434" font-size="12.5" fill="#3e4c59" font-weight="400" text-anchor="start" >keep: graph.txt</text>
<line x1="680" y1="468" x2="490" y2="468" stroke="#52606d" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="585.0" y="460" font-size="12.5" fill="#3e4c59" font-weight="400" text-anchor="middle" >#problem, empty: it went through</text>
<line x1="680" y1="502" x2="300" y2="502" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<text x="490.0" y="494" font-size="12.5" fill="#3e4c59" font-weight="400" text-anchor="middle" >data: nodes UPDATE A (to every page)</text>
<line x1="300" y1="532" x2="490" y2="532" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<text x="395.0" y="524" font-size="12.5" fill="#3e4c59" font-weight="400" text-anchor="middle" >news: send(read_network()), GET /all</text>
<line x1="490" y1="562" x2="680" y2="562" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<text x="585.0" y="554" font-size="12.5" fill="#3e4c59" font-weight="400" text-anchor="middle" >GET /all</text>
<line x1="680" y1="592" x2="490" y2="592" stroke="#52606d" stroke-width="1.6" marker-end="url(#a)"/>
<text x="585.0" y="584" font-size="12.5" fill="#3e4c59" font-weight="400" text-anchor="middle" >the page, swapped into #all</text>
<text x="40" y="630" font-size="13" fill="#52606d" font-weight="400" text-anchor="start" >The first lines run in the browser, many times a second. Only the drop goes to the server, which</text>
<text x="40" y="650" font-size="13" fill="#52606d" font-weight="400" text-anchor="start" >answers whether it went through; the page is drawn again from the news, on every open page.</text>
</svg>
